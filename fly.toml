# Fly.io config — deploy with:
#   fly launch --copy-config --yes    (first time; creates the app + volume)
#   fly deploy                        (subsequent deploys)
app = "domain-expert-demo"
primary_region = "iad"

[build]

[mounts]
  source = "data"
  destination = "/app/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
